[package]
name = "pyaio"
version = "0.1.0"
edition = "2021"
description = "Tokio to AsyncIO bridge. 40% Faster than pyo3-async-runtimes"

[lib]
name = "pyaio_faq"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time"] }
